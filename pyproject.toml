[project]
name = "voice-reader"
version = "0.1.0"
description = "Local English speech generation with IndexTTS-2.5"
requires-python = ">=3.10,<3.12"
dependencies = [
    "gradio==5.45.0",
    "imageio-ffmpeg==0.8.1",
    "indextts @ https://github.com/index-tts/index-tts/archive/d9e41aac89fd00b3d71497fddb287b7f24613712.zip",
]

[project.optional-dependencies]
cpu = ["torch==2.8.*", "torchaudio==2.8.*"]
gpu = ["torch==2.8.*", "torchaudio==2.8.*"]

[project.scripts]
voice-reader = "voice_reader.cli:main"
voice-reader-web = "voice_reader.web:launch"

[dependency-groups]
dev = ["pytest>=8.0,<9"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_reader"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
index-url = "https://mirrors.aliyun.com/pypi/simple"
default-groups = []
conflicts = [[{ extra = "cpu" }, { extra = "gpu" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cuda", extra = "gpu" },
]
torchaudio = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cuda", extra = "gpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://mirror.sjtu.edu.cn/pytorch-wheels/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://mirror.sjtu.edu.cn/pytorch-wheels/cu128"
explicit = true
